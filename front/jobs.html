<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Lectures submitted on this site, with their stage, mode, language, and result.">
    <title>History — LectureScribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Mono:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/front/styles.css?v=lang-2">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the list</a>

    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <defs>
        <symbol id="i-mark" viewBox="0 0 24 24"><path d="M2 9h2v6H2zM5.5 6h2v12h-2zM9 10h2v4H9zM13 6h9v2h-9zM13 11h9v2h-9zM13 16h6v2h-6z"/></symbol>
        <symbol id="i-new" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
        <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 5h3v3H3zM9 5h12v3H9zM3 10.5h3v3H3zM9 10.5h12v3H9zM3 16h3v3H3zM9 16h12v3H9z"/></symbol>
        <symbol id="i-queue" viewBox="0 0 24 24"><path d="M5 3h14v2l-5 7 5 7v2H5v-2l5-7-5-7V3z"/></symbol>
        <symbol id="i-archive" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2 4h20v6H2V4zm0 8h20v8H2v-8zm8 2h4v2h-4v-2z"/></symbol>
        <symbol id="i-arrival" viewBox="0 0 24 24"><path d="M9.6 19.2 2.8 12.4l2.6-2.6 4.2 4.2 9-9 2.6 2.6z"/></symbol>
        <symbol id="i-closed" viewBox="0 0 24 24"><path d="M18.9 3 12 9.9 5.1 3 3 5.1 9.9 12 3 18.9 5.1 21 12 14.1 18.9 21 21 18.9 14.1 12 21 5.1z"/></symbol>
        <symbol id="i-transcribe" viewBox="0 0 24 24"><path d="M3 10h2v4H3zM7 7h2v10H7zM11 4h2v16h-2zM15 7h2v10h-2zM19 10h2v4h-2z"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M10.5 2a8.5 8.5 0 1 0 5.2 15.2l4.6 4.6 1.9-1.9-4.6-4.6A8.5 8.5 0 0 0 10.5 2zm0 2.6a5.9 5.9 0 1 1 0 11.8 5.9 5.9 0 0 1 0-11.8z"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 8.5 12h-2.8A6.4 6.4 0 1 1 12 5.6c1.8 0 3.4.7 4.6 1.9L13 11h8V3l-2.6 2.6A8.97 8.97 0 0 0 12 3z"/></symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M13.2 3.6 21.6 12l-8.4 8.4-2.1-2.1 4.8-4.8H2.4v-3h13.5l-4.8-4.8z"/></symbol>
      </defs>
    </svg>

    <header class="signband">
      <div class="corridor">
        <a class="mark" href="/app">
          <span class="tile"><svg class="pict"><use href="#i-mark"></use></svg></span>
          LectureScribe
        </a>
        <nav class="destinations" aria-label="Sections">
          <a class="dest" href="/app"><svg><use href="#i-new"></use></svg>New transcript</a>
          <a class="dest" href="/app/jobs" aria-current="page"><svg><use href="#i-history"></use></svg>History</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="band ask-band">
        <div class="corridor">
          <div class="band-message">
            <span class="tile"><svg class="pict"><use href="#i-history"></use></svg></span>
            <div class="band-text">
              <p class="band-headline">Lectures submitted on this site</p>
            </div>
          </div>
          <div class="band-figure">
            <span>On the board</span>
            <strong id="board-total">&mdash;</strong>
          </div>
        </div>
      </div>

      <div class="filters">
        <div class="corridor">
          <div>
            <label class="sr-only" for="job-search">Search by title, lecture URL or job ID</label>
            <input id="job-search" type="search" placeholder="Search by title, lecture URL or job ID">
          </div>
          <div>
            <label class="sr-only" for="status-filter">Filter by state</label>
            <select id="status-filter">
              <option value="all">All states</option>
              <option value="completed">Completed</option>
              <option value="running">Running</option>
              <option value="queued">Queued</option>
              <option value="failed">Failed</option>
            </select>
          </div>
          <button id="refresh-jobs" class="action" type="button">
            <svg><use href="#i-refresh"></use></svg>
            Refresh
          </button>
        </div>
      </div>

      <div class="corridor">
        <div id="jobs-list" class="board"></div>
        <p id="jobs-count" class="board-count"></p>
      </div>
    </main>

    <script src="/front/jobs.js?v=lang-2"></script>
  </body>
</html>
