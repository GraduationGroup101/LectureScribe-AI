<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LectureScribe AI</title>
    <link rel="stylesheet" href="/front/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <h1>LectureScribe AI</h1>
            <p>Turn lecture videos into readable transcripts.</p>
          </div>
          <a class="docs-link" href="/docs">API Docs</a>
        </header>

        <form id="job-form" class="panel">
          <label class="field-label" for="youtube-url">Lecture YouTube URL</label>
          <div class="url-row">
            <input
              id="youtube-url"
              name="youtube_url"
              type="url"
              placeholder="https://www.youtube.com/watch?v=..."
              autocomplete="off"
              required
            >
            <button id="submit-button" type="submit">Start</button>
          </div>

          <fieldset class="mode-group">
            <legend>Output mode</legend>
            <label class="mode-option">
              <input type="radio" name="mode" value="fast" checked>
              <span>
                <strong>Fast output</strong>
                <small>Quicker result with lighter formatting.</small>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="formatted">
              <span>
                <strong>Better formatting</strong>
                <small>Cleaner text, slower processing.</small>
              </span>
            </label>
          </fieldset>
        </form>

        <section class="status-grid">
          <article class="panel status-panel">
            <div class="section-title">
              <h2>Current Job</h2>
              <span id="job-status" class="status-badge idle">Idle</span>
            </div>
            <dl class="job-details">
              <div>
                <dt>Job ID</dt>
                <dd id="job-id">-</dd>
              </div>
              <div>
                <dt>Mode</dt>
                <dd id="job-mode">-</dd>
              </div>
              <div>
                <dt>Cache</dt>
                <dd id="job-cache">-</dd>
              </div>
            </dl>
            <p id="job-message" class="message">Ready.</p>
          </article>

          <article class="panel jobs-panel">
            <div class="section-title">
              <h2>Previous Jobs</h2>
              <button id="refresh-jobs" class="secondary" type="button">Refresh</button>
            </div>
            <div id="jobs-list" class="jobs-list"></div>
          </article>
        </section>

        <section class="panel transcript-panel">
          <div class="section-title">
            <h2>Transcript</h2>
            <button id="copy-transcript" class="secondary" type="button" disabled>Copy</button>
          </div>
          <pre id="transcript-output">No transcript loaded.</pre>
        </section>
      </section>
    </main>

    <script src="/front/app.js"></script>
  </body>
</html>
