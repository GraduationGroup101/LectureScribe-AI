services:
  - type: web
    name: lecturescribe-ai
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      # Comma-separated secrets for gateways exempt from the per-IP job limit.
      - key: GATEWAY_KEYS
        sync: false
      - key: JOB_RATE_GLOBAL
        value: "60"
      # YouTube blocks datacenter IPs; upload a cookies export as a Secret File
      # named youtube-cookies.txt (or set YTDLP_PROXY) and keep this path.
      - key: YTDLP_COOKIES_FILE
        value: /etc/secrets/youtube-cookies.txt
